name: Collect G2B AI notices

on:
  schedule:
    # Aim for an actual start around 19:00 KST. This repo's scheduled runs lag ~8h
    # (old `17 4` / 13:17 KST → ~21:00 KST; `0 10` / 19:00 KST → ~04:00 KST).
    # So cron is ~11:17 KST (02:17 UTC): 11:17 + ~8h ≈ 19:17 KST. :17 avoids top-of-hour pileup.
    # Monday (KST) runs also do award / bidder / firm backfills.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to collect"
        required: false
        default: "14"
      rfp_bids:
        description: "RFP 요약을 먼저 만들 공고번호 (쉼표 구분, 선택)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require DATA_GO_KR_SERVICE_KEY
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repo secret DATA_GO_KR_SERVICE_KEY is missing."
            echo "Add it at: Settings → Secrets and variables → Actions"
            echo "Apply for keys at https://www.data.go.kr (입찰공고정보서비스 + 낙찰정보서비스)"
            exit 1
          fi
          echo "Secret present (length ${#KEY})."

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Plan run (daily incremental vs weekly full)
        id: plan
        run: |
          NOW_KST="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M %Z (weekday %u)')"
          NOW_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "now_kst=$NOW_KST"
          echo "now_utc=$NOW_UTC"
          echo "event=${{ github.event_name }} cron=02:17 UTC (~11:17 KST nominal, ~19 KST after typical lag)"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
            WEEKLY=true
            DEFAULT_DAYS=14
          else
            WEEKLY=false
            DEFAULT_DAYS=3
          fi
          DAYS="${{ github.event.inputs.days }}"
          DAYS="${DAYS:-$DEFAULT_DAYS}"
          echo "weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "planned weekly=$WEEKLY days=$DAYS"

      - name: Collect from Open API
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "8"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect --days "${{ steps.plan.outputs.days }}" --all-budgets --out ../data/notices.json
        working-directory: collector

      # 사전규격 needs its own 활용신청 on data.go.kr (15129437); failure is a warning only.
      - name: Collect AI pre-specifications (사전규격)
        id: prespecs
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect-prespecs --days "${{ steps.plan.outputs.days }}"
        working-directory: collector

      # 발주계획 (15129462)·계약정보 (15129427) each need their own 활용신청; warnings only.
      - name: Collect AI order plans (발주계획)
        id: plans
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect-plans
        working-directory: collector

      # First run (no data/contracts.json) backfills ~18 months, one call per keyword per month.
      - name: Collect AI service contracts (계약정보)
        id: contracts
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect-contracts --days "${{ steps.plan.outputs.days }}"
        working-directory: collector

      - name: Note collect outcome
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::Collect timed out or failed talking to apis.data.go.kr."
          echo "Continuing with existing data/notices.json so enrich/render can still run."

      - name: Reclassify notices with current keywords
        run: python -m g2b.collect reclassify
        working-directory: collector

      # Opened notices past 60 days without a winner show as 개찰 확인 필요; look a
      # bounded batch up by bid number each week. Shares Scsbid quota with OpengCompt.
      - name: Backfill awards for opened notices
        id: awards
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.5"
        run: python -m g2b.collect enrich-awards --days 30 --lookup-missing --lookup-limit 80
        working-directory: collector

      - name: Enrich bidder rankings (OpengCompt)
        id: bidders
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "8"
          G2B_SLEEP: "0.5"
          G2B_429_COOLDOWN: "120"
        run: python -m g2b.collect enrich-bidders --include-bootstrap --core-only --limit 400
        working-directory: collector

      # 사용자정보 서비스 (15129466) needs its own 활용신청; failure is a warning only.
      - name: Enrich firm profiles (조달업체 기본정보)
        id: firms
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "60"
          G2B_HTTP_RETRIES: "3"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect enrich-firms
        working-directory: collector

      - name: Sanitize budgets stored as won
        run: python -m g2b.collect sanitize-budgets
        working-directory: collector

      # Only public attachment text goes to Gemini (free tier); the company profile never does.
      - name: Summarize RFP attachments (Gemini)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RFP_BIDS: ${{ github.event.inputs.rfp_bids }}
        run: python -m g2b.collect summarize-rfp --limit 8 ${RFP_BIDS:+--bid "$RFP_BIDS"}
        working-directory: collector

      # last_success_at only advances on success, so pages rendered from old data
      # say so instead of showing today's date.
      - name: Record stage outcomes
        run: >-
          python -m g2b.collect mark-run
          --collect "${{ steps.collect.outcome }}"
          --prespecs "${{ steps.prespecs.outcome }}"
          --plans "${{ steps.plans.outcome }}"
          --contracts "${{ steps.contracts.outcome }}"
          --awards "${{ steps.awards.outcome }}"
          --bidders "${{ steps.bidders.outcome }}"
          --firms "${{ steps.firms.outcome }}"
        working-directory: collector

      # Legacy HTML: off by default (SPA). Set repo variable RENDER_HTML=1 to keep Python pages.
      - name: Render public site pages (optional HTML)
        env:
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
          RENDER_HTML: ${{ vars.RENDER_HTML }}
        run: |
          export RENDER_HTML="${RENDER_HTML:-0}"
          if [ -n "${COMPANY_PROFILE:-}" ]; then
            echo "COMPANY_PROFILE set — fit scores available for SPA export / D1."
          else
            echo "::warning::COMPANY_PROFILE missing — SPA/D1 without 적합도."
          fi
          echo "RENDER_HTML=$RENDER_HTML"
          python -m g2b.collect render all
        working-directory: collector

      # SPA JSON for the React public app (fit uses COMPANY_PROFILE when set).
      - name: Export SPA JSON
        env:
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
        run: python -m g2b.collect export-spa
        working-directory: collector

      # Internal D1: fit scores use COMPANY_PROFILE. Skip cleanly if Cloudflare secrets unset.
      - name: Sync notices to Cloudflare D1
        id: d1
        continue-on-error: true
        env:
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: python -m g2b.collect sync-d1
        working-directory: collector

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build React SPA (public + internal)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          npm ci --prefix web
          npm run build:public --prefix web
          cp -a web/dist web/dist-public
          npm run build:internal --prefix web
          cp -a web/dist web/dist-internal
          # stage-public merges SPA JSON into web/dist — restore public build as web/dist
          rm -rf web/dist
          mv web/dist-public web/dist

      # Public CF Pages: React dist + SPA JSON + feeds (no Functions on public project).
      - name: Deploy public site to Cloudflare Pages
        id: pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
          PYTHONPATH: collector
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skip public Pages deploy."
            exit 0
          fi
          python -m g2b.collect stage-public
          # Deploy from a copy without functions/ so public project stays static-only.
          rm -rf /tmp/ai-agent-market-public-dist
          cp -a web/dist /tmp/ai-agent-market-public-dist
          npx --prefix web wrangler pages deploy /tmp/ai-agent-market-public-dist \
            --project-name=ai-agent-market --commit-dirty=true
        working-directory: .

      - name: Deploy internal site to Cloudflare Pages
        id: pages_internal
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skip internal Pages deploy."
            exit 0
          fi
          npx --prefix web wrangler pages deploy web/dist-internal \
            --project-name=ai-agent-market-internal --commit-dirty=true
        working-directory: .

      # GitHub Pages (main/): rebuild with base /ai-agent-market/ then sync into repo root on commit.
      - name: Build GitHub Pages SPA
        id: gh_pages
        continue-on-error: true
        env:
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
          PYTHONPATH: collector
        run: |
          VITE_BASE=/ai-agent-market/ npm run build:public --prefix web
          rm -rf web/dist-gh
          mv web/dist web/dist-gh
          python -c "
          from pathlib import Path
          from g2b.public_dist import stage_spa_onto_dist
          print(stage_spa_onto_dist(Path('.').resolve(), Path('web/dist-gh')))
          "
          # GH Pages has no _redirects: 404.html = index.html for client routes.
          cp web/dist-gh/index.html web/dist-gh/404.html
          # Restore CF public dist if present
          rm -rf web/dist
          if [ -d /tmp/ai-agent-market-public-dist ]; then
            cp -a /tmp/ai-agent-market-public-dist web/dist
          fi

      # Record D1 / CF Pages after those steps so home stamp can show mirror health.
      - name: Record Cloudflare outcomes
        env:
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
          RENDER_HTML: ${{ vars.RENDER_HTML }}
        run: |
          export RENDER_HTML="${RENDER_HTML:-0}"
          python -m g2b.collect mark-run \
            --d1 "${{ steps.d1.outcome }}" \
            --pages "${{ steps.pages.outcome }}"
          python -m g2b.collect render index
        working-directory: collector

      # Slack failure must not block the data commit; unsent items retry next run.
      - name: Alerts (RSS, calendar, Slack)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m g2b.collect alerts
        working-directory: collector

      # Slack shortlist; same profile as D1 sync.
      - name: Go/No-Go (Slack)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DAYS=1
          if [ "${{ steps.plan.outputs.weekly }}" = "true" ]; then DAYS=3; fi
          python -m g2b.collect gonogo --days "$DAYS"
        working-directory: collector

      # data/seed/ is a frozen editorial extract; never re-extract it from rendered pages.
      - name: Commit data and pages if changed
        env:
          RENDER_HTML: ${{ vars.RENDER_HTML }}
          PYTHONPATH: collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export RENDER_HTML="${RENDER_HTML:-0}"

          git add data/notices.json data/reports.json data/run_status.json \
            data/bidders.json data/agencies.json reports.json reports/ \
            sitemap.xml robots.txt
          if [ -f data/alerts_state.json ]; then git add data/alerts_state.json; fi
          if [ -f data/prespecs.json ]; then git add data/prespecs.json; fi
          if [ -f data/firms.json ]; then git add data/firms.json; fi
          if [ -f data/order_plans.json ]; then git add data/order_plans.json; fi
          if [ -f data/contracts.json ]; then git add data/contracts.json; fi
          if [ -f data/rfp_summaries.json ]; then git add data/rfp_summaries.json; fi
          if [ -d feeds ]; then git add feeds/; fi

          if [ "$RENDER_HTML" = "1" ]; then
            git add band.html awards.html index.html competitors.html prespecs.html pricing.html plans.html \
              bidders.html agencies.html deliverables.html alerts.html 404.html \
              assets/site.css assets/table-filter.js assets/watch.js assets/dday.js assets/price-calc.js
            git add -A bids/
          elif [ -d web/dist-gh ]; then
            # Sync React SPA (+ data/spa, feeds) into repo root for GitHub Pages (main/).
            mkdir -p assets
            cp -a web/dist-gh/assets/. assets/
            cp web/dist-gh/index.html index.html
            cp web/dist-gh/404.html 404.html
            mkdir -p data
            rm -rf data/spa
            cp -a web/dist-gh/data/spa data/spa
            if [ -d web/dist-gh/data ]; then
              for f in bidders agencies firms prespecs order_plans reports contracts; do
                if [ -f "web/dist-gh/data/${f}.json" ]; then cp "web/dist-gh/data/${f}.json" "data/${f}.json"; fi
              done
            fi
            if [ -d web/dist-gh/feeds ]; then mkdir -p feeds; cp -a web/dist-gh/feeds/. feeds/; fi
            # Legacy HTML stubs → SPA routes (only when HTML render is off).
            python -m g2b.collect write-spa-redirects --out .
            git add index.html 404.html assets/ data/spa/
            for f in band awards pricing plans prespecs bidders agencies competitors alerts deliverables; do
              if [ -f "${f}.html" ]; then git add "${f}.html"; fi
            done
            if [ -f reports/index.html ]; then git add reports/index.html; fi
            # Retire per-bid HTML shells once SPA owns detail.
            if [ -d bids ]; then git rm -r --ignore-unmatch bids/ || true; fi
          fi

          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh G2B AI notices and SPA site"
            # N-08: another push during collect must not fail the data commit.
            git pull --rebase --autostash origin HEAD
            git push
          fi

      - name: Fail run if collect or bidders failed
        if: steps.collect.outcome == 'failure' || steps.bidders.outcome == 'failure'
        run: |
          echo "::error::collect=${{ steps.collect.outcome }} bidders=${{ steps.bidders.outcome }}; pages show the last successful data date."
          exit 1
