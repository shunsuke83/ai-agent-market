name: Collect G2B AI notices

on:
  schedule:
    # Monday 00:30 KST = Sunday 15:30 UTC
    - cron: "30 15 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to collect"
        required: false
        default: "14"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require DATA_GO_KR_SERVICE_KEY
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repo secret DATA_GO_KR_SERVICE_KEY is missing."
            echo "Add it at: Settings → Secrets and variables → Actions"
            echo "Apply for keys at https://www.data.go.kr (입찰공고정보서비스 + 낙찰정보서비스)"
            exit 1
          fi
          echo "Secret present (length ${#KEY})."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Collect from Open API
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "8"
          G2B_SLEEP: "0.35"
        run: |
          DAYS="${{ github.event.inputs.days }}"
          DAYS="${DAYS:-14}"
          python -m g2b.collect collect --days "$DAYS" --all-budgets --out ../data/notices.json
        working-directory: collector

      - name: Note collect outcome
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::Collect timed out or failed talking to apis.data.go.kr."
          echo "Continuing with existing data/notices.json so enrich/render can still run."

      - name: Enrich bidder rankings (OpengCompt)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "8"
          G2B_SLEEP: "0.5"
          G2B_429_COOLDOWN: "120"
        run: python -m g2b.collect enrich-bidders --include-bootstrap --core-only --limit 400
        working-directory: collector

      - name: Sanitize budgets stored as won
        run: python -m g2b.collect sanitize-budgets
        working-directory: collector

      - name: Render band + awards + index + competitors + reports
        run: python -m g2b.collect render all
        working-directory: collector

      - name: Refresh bootstrap.json from rendered HTML
        run: python -m g2b.collect bootstrap --out ../data/bootstrap.json
        working-directory: collector

      - name: Commit data and pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bootstrap.json data/notices.json data/reports.json \
            reports.json reports/ \
            band.html awards.html index.html competitors.html
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh G2B AI notices and render pages"
            git push
          fi

      - name: Fail run if collect failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collect step failed; pages were refreshed from existing notices only."
          exit 1
