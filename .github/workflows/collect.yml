name: Collect G2B AI notices

on:
  schedule:
    # Daily 13:17 KST = 04:17 UTC. Keep it in daytime KST (apis.data.go.kr
    # times out overnight) and off the hour (scheduled starts lag). The Monday
    # (KST) run also does the heavy award / bidder backfills.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to collect"
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require DATA_GO_KR_SERVICE_KEY
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repo secret DATA_GO_KR_SERVICE_KEY is missing."
            echo "Add it at: Settings → Secrets and variables → Actions"
            echo "Apply for keys at https://www.data.go.kr (입찰공고정보서비스 + 낙찰정보서비스)"
            exit 1
          fi
          echo "Secret present (length ${#KEY})."

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Plan run (daily incremental vs weekly full)
        id: plan
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
            echo "weekly=true" >> "$GITHUB_OUTPUT"
            DEFAULT_DAYS=14
          else
            echo "weekly=false" >> "$GITHUB_OUTPUT"
            DEFAULT_DAYS=3
          fi
          DAYS="${{ github.event.inputs.days }}"
          echo "days=${DAYS:-$DEFAULT_DAYS}" >> "$GITHUB_OUTPUT"

      - name: Collect from Open API
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "8"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect --days "${{ steps.plan.outputs.days }}" --all-budgets --out ../data/notices.json
        working-directory: collector

      # 사전규격 needs its own 활용신청 on data.go.kr (15129437); failure is a warning only.
      - name: Collect AI pre-specifications (사전규격)
        id: prespecs
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect-prespecs --days "${{ steps.plan.outputs.days }}"
        working-directory: collector

      # 발주계획 (15129462)·계약정보 (15129427) each need their own 활용신청; warnings only.
      - name: Collect AI order plans (발주계획)
        id: plans
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect-plans
        working-directory: collector

      # First run (no data/contracts.json) backfills ~18 months, one call per keyword per month.
      - name: Collect AI service contracts (계약정보)
        id: contracts
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect collect-contracts --days "${{ steps.plan.outputs.days }}"
        working-directory: collector

      - name: Note collect outcome
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::Collect timed out or failed talking to apis.data.go.kr."
          echo "Continuing with existing data/notices.json so enrich/render can still run."

      - name: Reclassify notices with current keywords
        run: python -m g2b.collect reclassify
        working-directory: collector

      # Opened notices past 60 days without a winner show as 개찰 확인 필요; look a
      # bounded batch up by bid number each week. Shares Scsbid quota with OpengCompt.
      - name: Backfill awards for opened notices
        id: awards
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "4"
          G2B_SLEEP: "0.5"
        run: python -m g2b.collect enrich-awards --days 30 --lookup-missing --lookup-limit 80
        working-directory: collector

      - name: Enrich bidder rankings (OpengCompt)
        id: bidders
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "90"
          G2B_HTTP_RETRIES: "8"
          G2B_SLEEP: "0.5"
          G2B_429_COOLDOWN: "120"
        run: python -m g2b.collect enrich-bidders --include-bootstrap --core-only --limit 400
        working-directory: collector

      # 사용자정보 서비스 (15129466) needs its own 활용신청; failure is a warning only.
      - name: Enrich firm profiles (조달업체 기본정보)
        id: firms
        if: steps.plan.outputs.weekly == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          G2B_CONNECT_TIMEOUT: "15"
          G2B_TIMEOUT: "60"
          G2B_HTTP_RETRIES: "3"
          G2B_SLEEP: "0.35"
        run: python -m g2b.collect enrich-firms
        working-directory: collector

      - name: Sanitize budgets stored as won
        run: python -m g2b.collect sanitize-budgets
        working-directory: collector

      # Only public attachment text goes to Gemini (free tier); the company profile never does.
      - name: Summarize RFP attachments (Gemini)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m g2b.collect summarize-rfp --limit 8
        working-directory: collector

      # last_success_at only advances on success, so pages rendered from old data
      # say so instead of showing today's date.
      - name: Record stage outcomes
        run: >-
          python -m g2b.collect mark-run
          --collect "${{ steps.collect.outcome }}"
          --prespecs "${{ steps.prespecs.outcome }}"
          --plans "${{ steps.plans.outcome }}"
          --contracts "${{ steps.contracts.outcome }}"
          --awards "${{ steps.awards.outcome }}"
          --bidders "${{ steps.bidders.outcome }}"
          --firms "${{ steps.firms.outcome }}"
        working-directory: collector

      - name: Render band + awards + index + competitors + reports
        run: python -m g2b.collect render all
        working-directory: collector

      # Slack failure must not block the data commit; unsent items retry next run.
      - name: Alerts (RSS, calendar, Slack)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m g2b.collect alerts
        working-directory: collector

      # Scores stay private: profile from a secret, output to Slack only, counts only in the log.
      - name: Go/No-Go (Slack only)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMPANY_PROFILE: ${{ secrets.COMPANY_PROFILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m g2b.collect gonogo --days "${{ steps.plan.outputs.weekly == 'true' && 3 || 1 }}"
        working-directory: collector

      # data/seed/ is a frozen editorial extract; never re-extract it from rendered pages.
      - name: Commit data and pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/reports.json data/run_status.json \
            reports.json reports/ \
            band.html awards.html index.html competitors.html prespecs.html pricing.html plans.html
          if [ -f alerts.html ]; then git add alerts.html feeds/; fi
          if [ -f data/alerts_state.json ]; then git add data/alerts_state.json; fi
          if [ -f data/prespecs.json ]; then git add data/prespecs.json; fi
          if [ -f data/firms.json ]; then git add data/firms.json; fi
          if [ -f data/order_plans.json ]; then git add data/order_plans.json; fi
          if [ -f data/contracts.json ]; then git add data/contracts.json; fi
          if [ -f data/rfp_summaries.json ]; then git add data/rfp_summaries.json; fi
          git add -A bids/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh G2B AI notices and render pages"
            git push
          fi

      - name: Fail run if collect or bidders failed
        if: steps.collect.outcome == 'failure' || steps.bidders.outcome == 'failure'
        run: |
          echo "::error::collect=${{ steps.collect.outcome }} bidders=${{ steps.bidders.outcome }}; pages show the last successful data date."
          exit 1
