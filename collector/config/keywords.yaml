# Title-keyword rules matching deliverables.html + reverse-engineered band.html labels.
# First matching scope rule wins for 범위; field tags are multi-label.
#
# 생성형·Agent 핵심 (deliverables): 생성형, 초거대, LLM, RAG, AI 에이전트,
# AI 상담·챗봇·플랫폼, AX 정보화전략 등.
# AI 일반: 그 밖의 AI / 인공지능 / AX / OCR / 음성인식 / 지능형 등.

scope:
  생성형·Agent:
    any:
      - 생성형
      - 초거대
      - LLM
      - sLLM
      - SLLM
      - RAG
      - AI 에이전트
      - AI에이전트
      - Agent
      - 에이전틱
      - 챗봇
      - 콜봇
      - 언어모델
      - 거대 언어
      - 거대언어
      - AI 상담
      - AI상담
      - AI 플랫폼
      - AI플랫폼
      - 인공지능 플랫폼
      - Generative
      - GAI
  AI SW 확대:
    any:
      - AI
      - 인공지능
      - ＡＩ
      - AX
      - OCR
      - 음성인식
      - 딥러닝
      - 머신러닝
      - 기계학습
      - 지능형
      - NPU
      - 컴퓨터비전
      - 머신비전
      - 에이전트
      # Latin keywords match only as whole words (no Air/KAIST/Maxwell); list compounds here.
      - AIOps
      - AIDT
      - AXDX
      - AID 전환
      - AID전환

