# Editorial analysis for the SPA «국내 전문기업» page.
# Live bids/wins/amounts are computed at export; prose here is human-authored.
# Source: 국내 AI 전문기업 분석 요약 (2026-11-24).

title: 국내 AI 전문기업 분석 요약
as_of: "2026-11-24"
author: 손대희

lede: >
  국내 전문기업 화면의 기업들은 공공 AI 입찰에서 생성형·Agent 사업 금액의 상당 비중을
  차지합니다. 아래는 사이트가 고른 전문기업과, 그들과 같은 입찰에서 자주 만난 목록 밖
  경쟁사를 나라장터 수집분으로 다시 집계한 분석입니다.

bullets:
  - 화면 기업은 두 묶음입니다. 전문기업으로 유형을 붙인 곳과, 그들과 자주 만난 목록 밖 경쟁사입니다.
  - 건수는 와이즈넛, 금액은 큰 사업 한두 건을 쥔 업체가 좌우합니다. 상장 3강 안에서는 코난테크놀로지가 직접 대결에 강합니다.
  - 공공 구축 전문 중소기업의 낙찰 비율은 상장 3강과 비슷한 수준이며, NIA·지자체 실증 과제가 무대입니다.
  - 큰 금액은 목록 밖·대형 SI도 가져갑니다. 삼성SDS·아이티센엔텍·LG CNS 등은 화면 어느 곳보다 클 수 있습니다.
  - 제논은 10억 원 안팎에서 이기고, 예산 20억 초과·상장 3강 동시 입찰에서는 아직 낙찰이 없습니다.

sections:
  - id: listed-three
    title: 구축형 플랫폼 상장 3강
    paragraphs:
      - >
        와이즈넛, 코난테크놀로지, 솔트룩스는 자체 LLM과 GS 1등급 제품을 갖고 주사업자로 입찰합니다.
        세 회사 모두 매출에서 LLM·에이전트 비중이 커지고 있지만 영업손실 상태입니다.
      - >
        와이즈넛은 낙찰 건수가 가장 많습니다. 코난테크놀로지는 생성형·Agent 비중이 높고
        법제처 생성형 AI 법령검색 등 대형 건을 가져갔습니다. 솔트룩스는 강원랜드 등이 대표 수주이며
        순위 편차가 큽니다. 자회사 다이퀘스트도 화면에 따로 올라 있습니다.
      - >
        와이즈넛은 낙찰 건수가 많지만 코난과 직접 만나면 밀리는 경우가 많습니다.
        예금보험공사·가스안전공사·법제처 사업이 코난으로 간 사례가 있습니다.

  - id: public-builders
    title: 공공 AI 구축 전문 중소기업
    paragraphs:
      - >
        대부분 10~20억 원대 사업이고 한국지능정보사회진흥원(NIA) 발주가 많습니다.
        낙찰 비율은 상장 3강과 비슷한 수준입니다.
      - >
        클라이온은 서울시 챗봇·행정지원 AI 에이전트를 연이어 수주했고,
        아이브릭스는 NIA·데이터산업진흥원 등 2026년 낙찰이 있습니다.
        퍼블릭에이아이는 국세에 이어 지방세 상담을 이어 가며 세금 상담 분야를 파고듭니다.
        엠큐닉은 자주 최종 경쟁까지 가지만 낙찰은 상대적으로 적습니다.

  - id: saas
    title: 구독·SaaS형 (교육·지자체)
    paragraphs:
      - >
        마인드로직, 타임리(업스테이지), 상상력집단, 이스트소프트가 대학·장학재단 생성형 AI
        도입 사업에서 번갈아 만납니다. 건당 금액이 큰 편입니다.
      - >
        서울대 사업은 연도별로 타임리·상상력집단이 앞섰고,
        한국장학재단 대형 건은 마인드로직이 낮은 투찰가로 가져간 사례가 있습니다.

  - id: startups
    title: 신흥 스타트업·부품 공급형
    paragraphs:
      - >
        입찰 기록이 적어 표본이 작습니다. 신흥 쪽에서는 인핸스의 직업훈련 AI 심사시스템 수주,
        부품 공급형에서는 포티투마루의 예금보험공사 수주 등이 눈에 띕니다.
        공동수급·하도급 참여는 이 기록에 안 잡힐 수 있습니다.

  - id: outside
    title: 목록 밖 경쟁사
    paragraphs:
      - >
        데이터·SI 성격 회사가 많고, 같은 기관 후속 사업을 이어서 따는 패턴이 뚜렷합니다.
        엠티데이타(경기 생성형 AI 플랫폼 등), 모비젠(도로교통공단 연속), 유플러스아이티(헌법재판소 연속),
        아일리스프런티어(서울종합방재센터), 솔리데오(식약처) 등이 대표적입니다.

  - id: landscape
    title: 경쟁 구도
    paragraphs:
      - >
        생성형·Agent 사업에서는 화면 기업 비중이 크지만, AI 사업 전체로 보면 대형 SI·통신사 비중이 큽니다.
        화면 밖에서는 KT·데이타이음·삼성SDS 등의 대형 생성형 수주와,
        AI 전체 기준 삼성SDS·아이티센엔텍·LG CNS의 금액이 두드러집니다.
      - >
        NIA가 가장 큰 무대입니다. 한 기관에서 이어서 따는 패턴(모비젠·도로교통공단,
        유플러스아이티·헌법재판소, 클라이온·서울시, 엠티데이타·경기도, 제논·해양진흥 등)이 있습니다.
      - >
        가격은 대부분 예산에 붙여 씁니다. 낮게 쓰는 편은 YH데이타베이스·이스트소프트·제논·솔트룩스 등입니다.

  - id: xenon
    title: 제논의 위치
    paragraphs:
      - >
        제논은 목록 밖 경쟁사에 포함됩니다. 10억 원 안팎 사업에서 낙찰이 있고,
        생성형·Agent 투찰 비중이 높습니다. 예산 20억 초과 사업과 상장 3강이 함께 들어온 입찰에서는
        아직 낙찰이 없습니다. 투찰가는 예산 대비 낮은 편(약 88~91%)입니다.
      - >
        발전·금융 공기업(남동발전, 해양진흥공사, 한국투자공사 등)에 투찰이 모여 있습니다.
        한국투자공사 1차는 개찰 1순위였지만 낙찰자 확정이 데이터에 없으면 집계에서 빠질 수 있습니다.

head_to_head_notes:
  - pair: [와이즈넛, 코난테크놀로지]
    note: 직접 대결에서 코난이 앞서는 경우가 많음
  - pair: [솔트룩스, 코난테크놀로지]
    note: 맞대결이 잦음
  - pair: [와이즈넛, 퍼블릭에이아이]
    note: 세금 상담 등에서 퍼블릭에이아이가 앞선 사례

limitations:
  - 투찰 업체 목록이 있는 공고만 집계하므로 투찰 횟수는 실제보다 적고, 낙찰 비율은 높게 보일 수 있습니다.
  - 2026-09-28 이전은 주로 8억 원 이상 사업 위주라 소규모 수주가 빠질 수 있습니다.
  - 공동수급·하도급은 입찰 기록에 남은 회사만 집계합니다.
  - 유형·자체 모델·조달 인증은 사이트 정리값이며 일부는 주장·미확인입니다. 직원 수는 조달청 등록값입니다.
  - 일부 낙찰금액이 비정상적으로 작게 잡힌 건(단가·표기)이 있을 수 있습니다.

sources:
