# Internal app: Cloudflare Pages + D1.
# Create the D1 DB once, then paste database_id here:
#   npx wrangler d1 create ai-agent-market
name = "ai-agent-market-internal"
compatibility_date = "2025-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "ai-agent-market"
database_id = "70c9f8e4-f902-40b7-80e8-d9f94a5fa0b2"
migrations_dir = "migrations"
