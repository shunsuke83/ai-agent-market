# Open API title search terms (collect). Keep short — each kw hits the API.
search_keywords:
  - AI
  - 인공지능
  - 생성형
  - LLM
  - RAG
  - AX
  - 지능형
  - 챗봇
  - 에이전트

filters:
  # Budget band used by band.html (억 원)
  band_min_eok: 8.0
  band_max_eok: 30.0
  # band.html: not AI SW delivery work — kept in notices.json, dropped from the band
  band_exclude_title:
    - 감리
    - PMO
    - 사업관리
    - 3자단가
    - PMC
    - 봉사단
    - 신축공사
    - 폐목재
    - 폐기물
  band_exclude_natures:
    - 연구·교육·행사
  # ...unless the title also says it builds something (교육지원시스템 구축 등)
  band_keep_title:
    - 구축
    - 개발
    - 고도화
    - 시스템
    - 플랫폼
  # 사전규격 물품(thng): SW사업 대상(swBizObjYn=Y)이거나 SW 납품이 분명할 때만 남긴다.
  # sw → 항상 유지, hardware → 제외, keep → 하드웨어 단어가 없을 때만 유지.
  # 용역은 band_exclude_* 규칙을 그대로 쓴다.
  prespec_goods_sw_title:
    - 소프트웨어
    - SW
    - S/W
    - 라이선스
    - 라이센스
    - 사용권
    - 구독
    - ChatGPT
  prespec_goods_hardware_title:
    - GPU
    - 서버
    - Server
    - 스토리지
    - 장비
    - 장치
    - 기자재
    - 센서
    - 모듈
    - 인버터
    - 워크스테이션
    - 하드웨어
    - H/W
    - PC
    - 로봇
    - 차량
  prespec_goods_keep_title:
    - 솔루션
    - 플랫폼
    - 프로그램
    - 챗봇
    - 생성형
    - LLM
    - 시스템
  # band.html 후속 본사업 후보: ISP·전략 공고 lookback / floor / cap
  followup_days: 730
  followup_min_eok: 1.0
  followup_limit: 60
  # awards.html large awards threshold
  large_award_min_eok: 30.0
  # bid notice search start
  history_start: "2023-01-01"
