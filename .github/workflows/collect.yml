name: Collect G2B AI notices

on:
  schedule:
    # Monday 00:30 KST = Sunday 15:30 UTC
    - cron: "30 15 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to collect"
        required: false
        default: "14"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Require DATA_GO_KR_SERVICE_KEY
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repo secret DATA_GO_KR_SERVICE_KEY is missing."
            echo "Add it at: Settings → Secrets and variables → Actions"
            echo "Apply for keys at https://www.data.go.kr (입찰공고정보서비스 + 낙찰정보서비스)"
            exit 1
          fi
          echo "Secret present (length ${#KEY})."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r collector/requirements.txt

      - name: Collect from Open API
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days }}"
          DAYS="${DAYS:-14}"
          python -m g2b.collect collect --days "$DAYS" --all-budgets --out ../data/notices.json
        working-directory: collector

      - name: Render band.html + index stamp
        run: python -m g2b.collect render all
        working-directory: collector

      - name: Refresh bootstrap.json from rendered HTML
        run: python -m g2b.collect bootstrap --out ../data/bootstrap.json
        working-directory: collector

      - name: Commit data and pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bootstrap.json data/notices.json band.html index.html
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh G2B AI notices and render band"
            git push
          fi
